<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Exemplo tabela</title>
</head>
<body>
    <h1>Exemplo Tabela</h1>
</body>
    <!-- Cria tabela-->
    <table>
        <!--cabeçalho da tabela-->
        <thead>
            <!--linha da tabela-->
            <tr>
                <!--colunas scope e apenas para semantica sem efeito-->
                <td scope="col" class="letra-laranja">Cabeçalho01</td>
                <td scope="col">Cabeçalho02</td>
                <td scope="col">Cabecalho03</td>
            </tr>
        </thead>
        <!--corpo da tabela parte principal-->
        <tbody>
            <td>A</td>
            <td>1</td>
            <td>!</td>
            <!--pula um linha TR-->
            <tr>
                <td>B</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>C</td>
                <td>3</td>
                <td>@</td>
            </tr>
        </tbody>

    </table>
</body>
<!--rodape da tabela-->
<tfooter>

</tfooter>
</html>
